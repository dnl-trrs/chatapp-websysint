version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - echo "NEXT_PUBLIC_AWS_REGION=$NEXT_PUBLIC_AWS_REGION" >> .env.production
        - echo "NEXT_PUBLIC_COGNITO_USER_POOL_ID=$NEXT_PUBLIC_COGNITO_USER_POOL_ID" >> .env.production
        - echo "NEXT_PUBLIC_COGNITO_CLIENT_ID=$NEXT_PUBLIC_COGNITO_CLIENT_ID" >> .env.production
        - echo "NEXT_PUBLIC_COGNITO_IDENTITY_POOL_ID=$NEXT_PUBLIC_COGNITO_IDENTITY_POOL_ID" >> .env.production
        - echo "NEXT_PUBLIC_S3_BUCKET=$NEXT_PUBLIC_S3_BUCKET" >> .env.production
        - echo "NEXT_PUBLIC_API_GATEWAY_URL=$NEXT_PUBLIC_API_GATEWAY_URL" >> .env.production
        - echo "NEXT_PUBLIC_WEBSOCKET_URL=$NEXT_PUBLIC_WEBSOCKET_URL" >> .env.production
        - echo "NEXT_PUBLIC_DYNAMODB_USERS_TABLE=$NEXT_PUBLIC_DYNAMODB_USERS_TABLE" >> .env.production
        - echo "NEXT_PUBLIC_DYNAMODB_CONVERSATIONS_TABLE=$NEXT_PUBLIC_DYNAMODB_CONVERSATIONS_TABLE" >> .env.production
        - echo "NEXT_PUBLIC_DYNAMODB_MESSAGES_TABLE=$NEXT_PUBLIC_DYNAMODB_MESSAGES_TABLE" >> .env.production
        - echo "NEXT_PUBLIC_DYNAMODB_FRIENDS_TABLE=$NEXT_PUBLIC_DYNAMODB_FRIENDS_TABLE" >> .env.production
        - echo "NEXT_PUBLIC_DYNAMODB_FRIEND_REQUESTS_TABLE=$NEXT_PUBLIC_DYNAMODB_FRIEND_REQUESTS_TABLE" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*